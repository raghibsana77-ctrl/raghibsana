<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #dddddd;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 600;
            margin-bottom: 30px;
        }

        /* Countdown Styles */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .count-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            min-width: 80px;
        }

        .count-box span {
            font-size: 2rem;
            font-weight: 600;
            display: block;
        }

        .count-box p {
            font-size: 0.8rem;
            color: #ccc;
            text-transform: uppercase;
        }

        /* Subscribe Button */
        .btn-subscribe {
            display: inline-block;
            background: #ffffff;
            color: #000000;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 40px;
        }

        .btn-subscribe:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }

        /* Social Icons */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-links a {
            color: #ffffff;
            font-size: 1.5rem;
            transition: color 0.3s ease;
        }

        .social-links a:hover {
            color: #0088cc;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .countdown { gap: 10px; }
            .count-box { min-width: 65px; padding: 10px; }
            .count-box span { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <p class="subtitle">We know the way</p>
        <h1>Our Website is Coming Soon</h1>

        <!-- Countdown Timer -->
        <div class="countdown">
            <div class="count-box">
                <span id="days">00</span>
                <p>Days</p>
            </div>
            <div class="count-box">
                <span id="hours">00</span>
                <p>Hours</p>
            </div>
            <div class="count-box">
                <span id="minutes">00</span>
                <p>Minutes</p>
            </div>
            <div class="count-box">
                <span id="seconds">00</span>
                <p>Seconds</p>
            </div>
        </div>

        <!-- Call to Action -->
        <a href="https://www.youtube.com/@ryomen_2418" target="_blank" class="btn-subscribe">
            Subscribe
        </a>

        <!-- Social Media Links -->
        <div class="social-links">
            <a href="https://www.facebook.com/Indiahistory0/" target="_blank" title="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://www.instagram.com/raghibsana/" target="_blank" title="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://www.youtube.com/@ryomen_2418" target="_blank" title="YouTube">
                <i class="fab fa-youtube"></i>
            </a>
        </div>
    </div>

    <script>
        // Set launch date (Adjust year, month, day, time as needed)
        const targetDate = new Date("October 15, 2026 15:07:03 UTC").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = days < 10 ? "0" + days : days;
                document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
                document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
                document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
            } else {
                document.querySelector(".countdown").innerHTML = "<h3>We are Live!</h3>";
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
